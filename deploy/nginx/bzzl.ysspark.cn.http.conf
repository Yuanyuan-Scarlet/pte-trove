# 首次签发证书前临时使用；证书签发后替换为 bzzl.ysspark.cn.conf。
limit_req_zone $binary_remote_addr zone=prep_admin_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name bzzl.ysspark.cn;

    client_max_body_size 110m;

    location /.well-known/acme-challenge/ {
        root /var/www/bzzl.ysspark.cn;
    }

    location = /api/admin/login {
        limit_req zone=prep_admin_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }
}
