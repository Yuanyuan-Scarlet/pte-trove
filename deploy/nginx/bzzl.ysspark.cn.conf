# bzzl.ysspark.cn - 阿里云轻量应用服务器 nginx 配置
# Node.js 服务仅监听 127.0.0.1:3100，业务数据不放在 nginx 静态目录中。
limit_req_zone $binary_remote_addr zone=prep_admin_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name bzzl.ysspark.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/bzzl.ysspark.cn;
    }

    location / {
        return 301 https://bzzl.ysspark.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bzzl.ysspark.cn;

    ssl_certificate     /etc/letsencrypt/live/bzzl.ysspark.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bzzl.ysspark.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 110m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /api/admin/login {
        limit_req zone=prep_admin_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
}
